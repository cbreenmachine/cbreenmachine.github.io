<!DOCTYPE html>
<!-- Headless Chrome clamps its window to 500px wide, so phone screenshots are
     taken through this page, which holds the site in a 390px iframe.
     Usage: tools/phone.html?src=/%3Ftheme%3Ddark%23about -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>html, body { margin: 0; background: #fff; } iframe { display: block; width: 390px; height: 844px; border: 0; }</style>
</head>
<body>
  <iframe id="f" title="site"></iframe>
  <script>
    var src = new URLSearchParams(location.search).get('src') || '/';
    document.getElementById('f').src = src;
  </script>
</body>
</html>
